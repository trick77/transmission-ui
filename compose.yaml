# Production stack: transmission-daemon 4.0.5 with this UI baked in (see Containerfile).
#
# Two ways in, both to the same container port:
#   - the UI at https://${TM_HOST} through an external Traefik that terminates TLS
#     (requires the external "traefik" network: `docker network create traefik`)
#   - the RPC directly on :9091 on the LAN, for radarr/sonarr and transmission-remote
# The daemon's own RPC basic auth (TM_USER / TM_PASS) applies on both paths.
#
#   cp .env.example .env   # fill in TM_HOST, TM_USER / TM_PASS and the paths
#   docker compose up -d                 # pulls ghcr.io/trick77/transmission-ui (release.yaml)
#   docker compose up -d --build         # or build locally from the Containerfile
#
# Pinned to the 4.0.x line on purpose: 4.0.6, 4.1.0 and 4.1.1 were blacklisted by trackers
# (announce flooding); only bump after the trackers in use accept the new user-agent.
services:
  transmission:
    image: ghcr.io/trick77/transmission-ui:latest
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped

    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Zurich}"
      # RPC basic auth. The browser prompts once; the UI never stores these.
      USER: "${TM_USER}"
      PASS: "${TM_PASS}"
      # Where the daemon serves the UI from (baked into the image at /web).
      TRANSMISSION_WEB_HOME: /web
      # No HOST_WHITELIST: with RPC auth on, the daemon accepts any Host header
      # (rpc-server.cc isHostnameAllowed), so Traefik's public name needs no entry.
      # Peer port. The image rewrites settings.json from this on EVERY start, so
      # .env is the source of truth; a change in Settings › Network is reverted at
      # the next restart. Keep it equal to the mapping below.
      PEERPORT: "${TM_PEER_PORT:-51413}"
      # Everything else in settings.json is changed from the UI's Settings dialog.

    volumes:
      - ./config:/config                       # settings.json, resume data, torrent files
      - "${TM_DOWNLOADS:-./downloads}:/downloads"  # download-dir; subfolders (buffer, radarr, sonarr…) appear in the sidebar
      - "${TM_WATCH:-./watch}:/watch"          # drop .torrent files here to auto-add

    ports:
      # RPC + UI on the LAN. Traefik reaches the same port over the traefik network.
      - "9091:9091"
      # Peer port: BitTorrent traffic, not HTTP; never goes through Traefik. Same
      # number on both sides because PEERPORT above makes the daemon listen on it.
      - "${TM_PEER_PORT:-51413}:${TM_PEER_PORT:-51413}"
      - "${TM_PEER_PORT:-51413}:${TM_PEER_PORT:-51413}/udp"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-w", "%{http_code}", "http://127.0.0.1:9091/transmission/web/"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      start_interval: 5s
      retries: 3

    networks:
      - default
      - traefik

    deploy:
      resources:
        limits:
          cpus: "2.0"
          # Daemon RSS stays under ~300 MB with a few hundred torrents; the rest is page cache for
          # the pieces being verified or seeded. 1g is comfortable; raise if verify runs get slow.
          memory: 1g

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.transmission.rule: Host(`${TM_HOST}`)
      traefik.http.routers.transmission.entrypoints: websecure
      traefik.http.routers.transmission.tls: "true"
      traefik.http.services.transmission.loadbalancer.server.port: "9091"

networks:
  traefik:
    external: true
