# Production stack: this UI in front of a transmission-daemon you run elsewhere.
#
# NOT a complete deployment. It needs a reverse proxy that terminates TLS, and
# that part is yours: no port is published here, so the container is reachable
# only by a proxy attached to a network it shares. See "Reverse proxy" in
# README.md for what the proxy must do. The app is served at
# https://<PUBLIC_FQDN><BACKEND_BASE_PATH> and refuses to start without
# PUBLIC_FQDN.
#
# The image is the UI bundle plus a Go backend that
#   - terminates OIDC against your identity provider and keeps the session in a
#     signed cookie, and
#   - proxies /transmission/rpc to the daemon, attaching the daemon's basic auth
#     on the way out, so the browser never sees those credentials.
#
#   cp .env.example .env   # fill in the OIDC block, TRANSMISSION_* and the session secret
#   docker compose up -d                 # pulls ghcr.io/trick77/transmission-ui
#   docker compose up -d --build         # or build locally from the Containerfile
#
# The daemon itself is NOT in this image. TRANSMISSION_RPC_UPSTREAM points at it; it keeps
# its own RPC port for transmission-remote and the *arr apps.
#
# 4.1.x speaks JSON-RPC 2.0 with snake_case keys (rpc_version 19); the UI targets that and
# does not talk to 4.0.x any more. If a version bump gets the client blacklisted again, the
# sidebar shows "client rejected" per tracker within one announce cycle.
services:
  transmission-ui:
    image: ghcr.io/trick77/transmission-ui:latest
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped

    environment:
      BACKEND_ADDR: ":8080"
      PUBLIC_FQDN: "${PUBLIC_FQDN:?set PUBLIC_FQDN in .env, the hostname your proxy serves this app on}"
      # Path prefix the proxy forwards unstripped, e.g. /transmission; empty
      # when the app owns the whole hostname.
      BACKEND_BASE_PATH: "${BACKEND_BASE_PATH:-}"
      BACKEND_SESSION_SECRET: "${BACKEND_SESSION_SECRET:?generate one, e.g. openssl rand -base64 48}"
      # oidc (an identity provider) or form (a login page checked against
      # TRANSMISSION_USER/TRANSMISSION_PASSWORD, for setups with no IdP).
      BACKEND_AUTH_MODE: "${BACKEND_AUTH_MODE:-oidc}"
      BACKEND_OIDC_ISSUER: "${BACKEND_OIDC_ISSUER}"
      BACKEND_OIDC_CLIENT_ID: "${BACKEND_OIDC_CLIENT_ID}"
      BACKEND_OIDC_CLIENT_SECRET: "${BACKEND_OIDC_CLIENT_SECRET}"
      BACKEND_OIDC_REDIRECT_URL: "${BACKEND_OIDC_REDIRECT_URL}"
      BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL: "${BACKEND_OIDC_POST_LOGOUT_REDIRECT_URL:-}"
      # Empty = no group check; every authenticated user gets in.
      BACKEND_OIDC_ALLOWED_GROUP: "${BACKEND_OIDC_ALLOWED_GROUP:-}"
      # The daemon: where it is, and the RPC credentials to present to it.
      TRANSMISSION_RPC_UPSTREAM: "${TRANSMISSION_RPC_UPSTREAM:-http://transmission:9091}"
      TRANSMISSION_USER: "${TRANSMISSION_USER}"
      TRANSMISSION_PASSWORD: "${TRANSMISSION_PASSWORD}"
      # debug, info, warn or error; anything else stops the start.
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Orphan finder (Settings -> Maintenance), off unless both are set. Needs the
      # volumes and the user below too; see "Orphaned files" in README.md.
      # BACKEND_DATA_ROOTS: /data/torrents
      # BACKEND_DAEMON_CONFIG: /config
    # user: "1000:1000"                  # the daemon's PUID:PGID
    # volumes:
    #   - /srv/torrents:/data/torrents   # the same path the daemon uses
    #   - /srv/transmission:/config      # the daemon's config folder

    healthcheck:
      # Probes the liveness route <BACKEND_BASE_PATH>/healthz; only a
      # 2xx passes, so a 404 or a redirect means the app is not mounted where
      # it thinks it is. The daemon is not probed here (<path>/readyz does
      # that), so a daemon restart does not mark the UI unhealthy. The image
      # is distroless, so the binary probes itself rather than shelling out
      # to curl or wget.
      test: ["CMD", "/transmission-ui", "-healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      start_interval: 5s
      retries: 3

    # Reachable from other containers on a shared network, not from the host:
    # attach your reverse proxy's network here (and its labels or config), or
    # add a `ports:` mapping if the proxy runs on the host itself.
    expose:
      - "8080"
