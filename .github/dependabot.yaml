version: 2
updates:
  # React frontend
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      # First matching group wins, so the specific groups come first and the
      # catch-all stays last. vite, its react plugin, vitest and its coverage
      # provider are one dependency family: vitest pins a vite major range and
      # @vitest/coverage-v8 pins vitest's, so bumping any one alone fails npm ci
      # on ERESOLVE (or nests a second vite). They always travel together.
      vite-and-vitest:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Container base image (Containerfile, compose.dev.yaml).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
