name: CI

# ship check on every pull request (public repo: forks included, read-only token, no secrets). Own pushes are
# gated by the pre-push hook already; Dependabot and fork PRs never pass it.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: trick77/ship/.github/workflows/check.yaml@master
    with:
      go-dir: backend
      node-version: "26"
