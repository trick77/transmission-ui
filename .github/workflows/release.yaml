name: Release

on:
  push:
    branches: [master]
    # Only cut a release when something that ships actually changed: the image
    # is built from ui/ and the Containerfile. An ignore-list rather than an
    # allow-list on purpose: a new top-level directory starts out releasing,
    # which is the safe default. workflow_dispatch below is unfiltered, so a
    # release can always be forced by hand.
    paths-ignore:
      - "design/**"
      - "docs/**"
      - "hack/**"
      - ".github/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".env.example"
      - "Makefile"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "ui/e2e/**"
      - "ui/**/*.test.*"
      - "ui/playwright.config.ts"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: ver
        name: Compute next version
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          LATEST="${LATEST:-0.0.0}"
          IFS=. read -r MA MI PA <<< "$LATEST"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          SHORT=$(git rev-parse --short HEAD)
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "major=$MA"     >> "$GITHUB_OUTPUT"
          echo "minor=$MI"     >> "$GITHUB_OUTPUT"
          echo "short=$SHORT"  >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST -> $NEXT ($BUMP) at $SHORT" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.major }}
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.short }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag only AFTER the image push succeeds, so a failed release never leaves
      # an orphan git tag behind. create-ref needs no git credentials in the
      # checkout and is one atomic call; every repo in this family uses it.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.ver.outputs.version }}" \
            -f sha="${{ github.sha }}"

      # The UI is also useful without the image: mount ui/dist into an existing
      # daemon container and set TRANSMISSION_WEB_HOME=/web. Attach it as a zip.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: ui
      - run: (cd ui/dist && zip -qr "../../transmission-ui-${{ steps.ver.outputs.version }}.zip" .)

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cat > /tmp/release-notes.md <<NOTES
          Container image (transmission-daemon 4.0.5 + UI): \`ghcr.io/${{ github.repository }}:$VERSION\`

          UI only: download \`transmission-ui-$VERSION.zip\`, unzip it into a folder the daemon
          container can see, mount it at \`/web\` and set \`TRANSMISSION_WEB_HOME=/web\`.
          NOTES
          sed -i 's/^          //' /tmp/release-notes.md
          gh release create "$VERSION" \
            "transmission-ui-$VERSION.zip" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md
