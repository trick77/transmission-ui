name: Release

# By hand only: gh workflow run Release -f bump=patch. Tags X.Y.Z, builds and pushes the image (version, sha, X.Y,
# X, latest), GitHub release with notes from the commit subjects. auto: patch unless a Release: minor/major line.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major, auto]
        default: patch

jobs:
  release:
    uses: trick77/ship/.github/workflows/release.yaml@master
    with:
      bump: ${{ inputs.bump }}
      go-dir: backend
    permissions:
      contents: write
      packages: write
