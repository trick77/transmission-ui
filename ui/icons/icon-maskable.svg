<!--
  Source for icon-maskable-512.png only. Not shipped: ui/icons/ is outside
  Vite's publicDir, so nothing here is copied into the bundle.

  A maskable icon is cropped to whatever shape the Android launcher prefers —
  circle, squircle, rounded square, teardrop — and only the middle 80% of the
  square survives that crop. So this differs from icon-tile.svg in exactly one
  way: the chip is smaller again (46% vs 60%), which keeps every pixel of it
  inside that safe circle no matter which mask the launcher picks. The tile has
  to run edge to edge for the same reason it does on iOS — the launcher fills
  whatever the icon leaves transparent, and that fill is not ours to choose.

  Same three redrawn paths, 3.0-unit weights, solved inner scale and true-bbox
  centring as the other two; see icon.svg for all of it and for the derived
  transform formulas. This file's coverage C is 0.46. A near-square chip is the
  good case for a round crop: its corners are the only part near the safe
  circle's edge, and at 46% with an rx 4 radius they clear it with room to
  spare — the chip's furthest painted point is 18.11 units from centre against
  a 25.6 safe radius. The rx 4 corner is what bought the last of that margin;
  going back to rx 2 costs some of it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <linearGradient id="og" x1="0" y1="0" x2="0.72" y2="1">
    <stop offset="0" stop-color="#e08a68"/>
    <stop offset="1" stop-color="#c25f34"/>
  </linearGradient>
  <rect width="64" height="64" fill="#1f1f1e"/>
  <g transform="translate(12.3733 12.3733) scale(1.63556)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#og)"/>
    <g transform="translate(4.1238 3.8284) scale(0.65635)" fill="#1f1f1e">
      <path d="M10.5 3.4h3v9.6h-3z"/>
      <path d="M5.5 9.9 7.6 7.8 12 12.2l4.4-4.4 2.1 2.1-6.5 6.5z"/>
      <path d="M3.2 14.9h3v3.6h11.6v-3.6h3v6.6H3.2z"/>
    </g>
  </g>
</svg>
