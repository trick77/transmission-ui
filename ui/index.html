<!doctype html>
<html lang="en">
  <head>
    <!-- The backend rewrites the content to its own prefix when it serves this
         file. Left empty the app talks to the daemon's fixed /transmission/rpc,
         which is the bundle-only path where the daemon serves ui/dist itself. -->
    <meta name="tmui-base" content="">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <!-- Sources in ui/icons/, rasters regenerated by hack/gen-icons.sh. The
         manifest link stays bare on purpose: that fetch is credential-less.
         There is no favicon.ico; the backend 404s that path. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>transmission-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
