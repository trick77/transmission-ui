<!doctype html>
<html lang="en">
  <head>
    <!-- The backend rewrites the content to its own prefix when it serves this
         file. Left empty the app talks to the daemon's fixed /transmission/rpc,
         which is the bundle-only path where the daemon serves ui/dist itself. -->
    <meta name="tmui-base" content="">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <!-- Sources in ui/icons/, rasters regenerated by hack/gen-icons.sh. There is
         no favicon.ico; a bare path with an extension 404s rather than falling
         back to the shell (see isAssetRequest).

         crossorigin="use-credentials" on the manifest, NOT on the two icons:
         a manifest is fetched with credentials mode "omit" by default, and on
         the bundle-only path the daemon serves ui/dist from /transmission/web/
         behind its own basic auth, which answers that credential-less fetch
         with 401. The app is then not installable and Chrome's Application tab
         shows the manifest failing. The icons already carry credentials, so
         they need nothing. Harmless on the Go backend, where the bundle is
         same-origin and served unauthenticated. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
    <title>transmission-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
